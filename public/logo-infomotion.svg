<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Iconița Geometrică (Hexagon 3D / Mișcare) centrată și mărită -->
  <g transform="translate(12, 12)">
    <!-- Fața stângă -->
    <path d="M 20 40 L 0 30 L 0 10 L 20 20 Z" fill="#00E5C8"/>
    <!-- Fața dreaptă -->
    <path d="M 20 40 L 40 30 L 40 10 L 20 20 Z" fill="#00BFA6"/>
    <!-- Fața superioară -->
    <path d="M 20 20 L 0 10 L 20 0 L 40 10 Z" fill="#20F8D9"/>
    <!-- Umbră/Decupaj pentru efect de dinamism -->
    <polygon points="20,20 40,10 40,20 20,30" fill="#008B7D" opacity="0.6" />
  </g>
</svg>